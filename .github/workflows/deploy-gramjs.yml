name: Deploy GramJS Listeners

on:
  push:
    branches: [main]
    paths:
      - 'gramjs/**'

# Serialize production deploys instead of letting two merges race.
concurrency:
  group: deploy-gramjs
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  deploy-madhoneycub:
    name: Deploy tg-reader (Fly)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app tg-reader --remote-only
        working-directory: gramjs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-main:
    name: Deploy tg-reader-main (Fly)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app tg-reader-main --remote-only
        working-directory: gramjs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN }}
