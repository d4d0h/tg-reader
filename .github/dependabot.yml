version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  # The runtime dependencies live in the sub-packages, not the root
  # (which only holds the setup script's devDependencies).
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/gramjs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
