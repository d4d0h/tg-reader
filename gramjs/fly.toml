# Required secrets (set via `fly secrets set KEY=value`):
#   GRAMJS_SESSION   - StringSession string from auth.ts
#   API_ID           - Telegram app ID from my.telegram.org
#   API_HASH         - Telegram app hash from my.telegram.org
#   INGEST_TOKEN     - Shared token matching Cloudflare Worker INGEST_TOKEN
#   WORKER_URL       - Full URL of deployed Worker (no trailing slash)

app = "tg-reader"
primary_region = "ams"

# H4 (#103): the listener's SIGTERM drain has a 25s deadline — Fly must wait
# longer than its 5s default or the drain (and the final buffer persist) is cut.
kill_timeout = 30

[build]

[env]
NODE_ENV = "production"

[[mounts]]
source = "tg_state"
destination = "/data"

[processes]
app = "node dist/listener.js"

[[vm]]
memory = "256mb"
cpu_kind = "shared"
cpus = 1

[deploy]
strategy = "immediate"
